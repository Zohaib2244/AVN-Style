<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AVN Style preview</title>
<link rel="stylesheet" href="fonts-standalone.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="base.css">
<style>
  body { padding: 24px; overflow: auto; height: auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin-top: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
  .sw { height: 36px; border: 1px solid var(--border); border-radius: 6px; }
  .sw-name { font-size: var(--fs-micro); color: var(--text-muted-dim); margin-top: 3px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-family: var(--font-dot-gothic), monospace; font-size: var(--fs-lead); letter-spacing: .04em; margin: 0; }
</style>
</head>
<body>
<div class="frame">
  <div class="top">
    <h1>AVN Style</h1>
    <div class="row" id="palettes"></div>
    <button class="theme-toggle" id="mode" aria-label="toggle theme">◐</button>
  </div>

  <div class="grid">
    <div class="block accent-left">
      <div class="block-label">uptime</div>
      <div class="block-stat">99.8%</div>
      <div class="block-sub">last 24 hours</div>
    </div>
    <div class="block">
      <div class="block-label">now</div>
      <div class="block-value">mc-friends</div>
      <div class="block-value teal">25565</div>
      <div class="row"><span class="pill"><span class="status-dot up"></span>online</span>
        <span class="pill"><span class="status-dot busy"></span>starting</span>
        <span class="pill"><span class="status-dot down"></span>down</span></div>
    </div>
    <div class="block">
      <div class="block-label">controls</div>
      <div class="seg-row" id="seg">
        <button class="seg-btn active">paper</button><button class="seg-btn">vanilla</button><button class="seg-btn">fabric</button>
      </div>
      <div class="row">
        <button class="btn btn-primary">start</button>
        <button class="btn">restart</button>
        <button class="btn btn-danger">stop</button>
      </div>
      <div class="row">
        <input class="wset-input" value="Steve" aria-label="name">
        <select class="wset-select" aria-label="ram"><option>2 GB</option><option>3 GB</option></select>
        <label class="block-sub"><input type="checkbox" checked> whitelist</label>
      </div>
    </div>
    <div class="block" style="grid-column: 1 / -1">
      <div class="block-label">console</div>
      <div class="console">[19:21:04 INFO]: Done (6.2s)! For help, type "help"
[19:21:09 INFO]: Steve joined the game</div>
    </div>
    <div class="block" style="grid-column: 1 / -1">
      <div class="block-label">tokens</div>
      <div class="swatches" id="sw"></div>
    </div>
  </div>
</div>
<script>
  const root = document.documentElement;
  const pals = ["ember","slate","moss","plum","reef","raspberry","circuit","graphite"];
  const names = ["bg-page","bg-card","bg-nested","border","text-primary","accent-orange","accent-cyan"];
  const pal = document.getElementById("palettes");
  pals.forEach(p => {
    const b = document.createElement("button");
    b.className = "seg-btn" + (p === "ember" ? " active" : "");
    b.textContent = p;
    b.onclick = () => {
      p === "ember" ? root.removeAttribute("data-palette") : root.setAttribute("data-palette", p);
      pal.querySelectorAll(".seg-btn").forEach(x => x.classList.toggle("active", x === b));
    };
    pal.appendChild(b);
  });
  document.getElementById("mode").onclick = () =>
    root.setAttribute("data-theme", root.getAttribute("data-theme") === "dark" ? "light" : "dark");
  const sw = document.getElementById("sw");
  names.forEach(n => {
    const d = document.createElement("div");
    d.innerHTML = `<div class="sw" style="background:var(--${n})"></div><div class="sw-name">${n}</div>`;
    sw.appendChild(d);
  });
  document.getElementById("seg").addEventListener("click", e => {
    if (!e.target.classList.contains("seg-btn")) return;
    e.currentTarget.querySelectorAll(".seg-btn").forEach(x => x.classList.toggle("active", x === e.target));
  });
</script>
</body>
</html>
